name: Play deploy

# Deploys a TPP-produced AAB to a Google Play track.
#
# A Play-delivered plugin carries two signatures and ATAK only trusts one:
#   - TPP signs the bundle: code_transparency_signed.jwt inside the AAB,
#     signed by a TAK Product Center key on ATAK's plugin allowlist.
#   - Play re-signs the APKs with the app-signing key, which ATAK does
#     not recognize, so it validates the plugin via the TPP JWT instead.
# The AAB attached to the release MUST therefore be TPP output, byte for
# byte. A local bundle<Flavor>Release build has no JWT: Play accepts and
# installs it, and ATAK then reports "The signature for the plugin is
# INVALID". The verify step below refuses to sign or upload such a bundle.
#
# The TAK signing step (tak.gov TPP portal) is manual and has no API, so
# this runs on demand rather than on push:
#   1. Download the TPP result and attach its UNSIGNED `app-civ-release.aab`
#      — unmodified — to a GitHub Release. Check it first with
#      `scripts/verify-play-aab.ps1 -RequireUnsigned`.
#   2. Dispatch this workflow against that release tag.
# CI then verifies the TPP signature, signs the AAB with the upload key
# (from secrets) and uploads it via the Play Developer API. (The
# operator-local publishing runbook lives outside version control under
# docs/play-store/, which is gitignored.)
#
# Required secrets:
#   UPLOAD_KEYSTORE_B64       base64 of the upload keystore (.jks)
#   UPLOAD_KEYSTORE_PASSWORD  its password (also the key password)
#   UPLOAD_KEY_ALIAS          xv-upload
#   PLAY_SERVICE_ACCOUNT_JSON service account JSON with Play release access
#                             (added once the Google Cloud service account exists)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag holding the TPP AAB (asset: app-civ-release.aab)"
        required: true
      track:
        description: "Play track"
        required: true
        default: internal
        type: choice
        options: [internal, alpha, beta, production]
      status:
        description: "Release status on the track"
        required: true
        default: draft
        type: choice
        options: [draft, inProgress, completed]
      user_fraction:
        description: "Staged-rollout fraction for inProgress, exclusive 0.0-1.0 (e.g. 0.1 = 10%). For a full rollout use status=completed, not inProgress. Ignored for draft/completed."
        required: false
        default: "0.1"

permissions:
  contents: read

concurrency:
  # Serialize by Play application, NOT by github.ref. Every dispatch edits the
  # same Play app with the same service account, so two runs from different
  # tags/branches would otherwise get separate concurrency groups, overlap,
  # and invalidate each other's Play edits. A constant group = one at a time.
  group: play-deploy-com.atakmap.android.xv.plugin
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the AAB verifier
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Download AAB from the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # Pass the dispatch input through the environment, never
          # interpolated into the shell, so a crafted tag name can't inject.
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "$RELEASE_TAG" \
            --repo "$GH_REPO" \
            --pattern "app-civ-release.aab" \
            --output unsigned.aab
          test -s unsigned.aab

      - name: Verify the AAB carries a valid TPP code-transparency signature
        # Hard gate: fails unless the bundle is unmodified, unsigned TPP
        # output whose JWT verifies against a TAK Product Center key and
        # whose dex / native-lib hashes all match. Runs before any signing
        # material touches the runner.
        shell: pwsh
        run: ./scripts/verify-play-aab.ps1 -Path unsigned.aab -RequireUnsigned

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode upload keystore
        env:
          KS_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
        run: |
          echo "$KS_B64" | base64 -d > upload.jks
          test -s upload.jks

      - name: Sign AAB with the upload key
        env:
          KS_PASS: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: |
          jarsigner -keystore upload.jks -storepass:env KS_PASS \
            -signedjar signed.aab unsigned.aab "$KEY_ALIAS"
          jarsigner -verify signed.aab

      - name: Upload to Google Play
        # Pinned to the v1.1.5 commit SHA — a mutable tag on a third-party
        # action that gets the service-account JSON is a supply-chain risk.
        # Bump deliberately after reviewing the diff of a newer tag.
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.atakmap.android.xv.plugin
          releaseFiles: signed.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
          # The action requires a rollout fraction for inProgress and rejects
          # one for draft/completed. Pass it only for inProgress; the empty
          # string reads as "unset" for the other statuses.
          userFraction: ${{ inputs.status == 'inProgress' && inputs.user_fraction || '' }}

      - name: Scrub signing material from the runner
        if: always()
        run: rm -f upload.jks signed.aab unsigned.aab
